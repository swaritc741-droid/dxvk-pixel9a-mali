name: Build DXVK 1.7.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout DXVK 1.7.2
        uses: actions/checkout@v4
        with:
          repository: doitsujin/dxvk
          ref: v1.7.2
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            mingw-w64 \
            glslang-tools \
            wine64

      - name: Configure 64-bit build
        run: |
          meson setup \
            --cross-file build-win64.txt \
            --buildtype release \
            --prefix "$GITHUB_WORKSPACE/install" \
            build.w64

      - name: Compile DXVK
        run: |
          ninja -C build.w64

      - name: Install DXVK
        run: |
          ninja -C build.w64 install

      - name: Upload DXVK DLLs
        uses: actions/upload-artifact@v4
        with:
          name: DXVK-1.7.2-clean-x64
          path: |
            install/bin/*.dll

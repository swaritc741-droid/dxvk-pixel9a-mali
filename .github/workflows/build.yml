name: Build DXVK 1.7.2 Pixel 9a V1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout DXVK 1.7.2
        uses: actions/checkout@v4
        with:
          repository: doitsujin/dxvk
          ref: v1.7.2
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            mingw-w64 \
            glslang-tools \
            wine64

      - name: Select POSIX MinGW compiler
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Apply Pixel 9a Mali V1 patch
        run: |
          sed -i '/\/\/ Default to a chunk size of 128 MiB/{n;s/128 << 20/64 << 20/;}' src/dxvk/dxvk_memory.cpp
          grep -A2 "Default to a chunk size" src/dxvk/dxvk_memory.cpp

      - name: Configure 64-bit build
        run: |
          meson setup \
            --cross-file build-win64.txt \
            --buildtype release \
            --prefix "$GITHUB_WORKSPACE/install" \
            build.w64

      - name: Compile DXVK V1
        run: |
          ninja -C build.w64

      - name: Install DXVK V1
        run: |
          ninja -C build.w64 install

      - name: Upload DXVK V1 DLLs
        uses: actions/upload-artifact@v4
        with:
          name: DXVK-1.7.2-Pixel9a-Mali-V1-x64
          path: |
            install/bin/*.dll
